name: L100C finite Qwen08 BF16 thinking reference
on:
  push:
    branches: ['flygraph/l100c-qwen08-20261009']
    paths: ['runs/l100c_20261009/bench/RUN_ONCE.json']
permissions:
  contents: write
jobs:
  reference:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Exact public source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" repo
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Finite reference inference; no FlyGraph training
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '4'
        run: python3 -u repo/runs/l100c_20261009/bench/qwen08.py
