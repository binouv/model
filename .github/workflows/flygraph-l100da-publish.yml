name: FlyGraph L100DA exact trained-artifact publication
on:
  push:
    branches: [main]
    paths: ['runs/l100da_20261012/transport/TRANSFER_SPEC.json']
permissions:
  contents: write
concurrency:
  group: flygraph-l100da-artifact-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'binouv/model'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact source commit
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout -b main FETCH_HEAD
      - name: Install CPU verification dependencies
        shell: bash
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install --quiet safetensors pytest
      - name: Check transport and preserve exact locally trained bytes
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python -m unittest discover -s runs/artifact_recovery_20261012 -p 'test_checkpoint_parts.py' -v
          python -m unittest discover -s runs/artifact_transfer_20261012 -p 'test_transport.py' -v
          python runs/l100da_20261012/transport/publish.py
