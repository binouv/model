name: L100V assemble completed Qwen reference
on:
  push:
    branches: ['flygraph/l100v-reference-20261011']
    paths: ['runs/l100v_20261011/bench/ASSEMBLE_ONCE.json']
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact response snapshot
        run: |
          set -euo pipefail
          git init repo
          git -C repo remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C repo fetch --depth 1 origin "$GITHUB_SHA"
          git -C repo checkout --detach FETCH_HEAD
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Archive completed requests only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u repo/runs/l100v_20261011/bench/assemble_reference.py
