name: FlyGraph G4S finite completion and real weights
on:
  push:
    branches: ['flygraph/g4s-finish-20260926']
    paths: ['runs/g4s_prefix/RUN_ONCE.json']
permissions:
  contents: write
concurrency:
  group: flygraph-g4s-finish-20260926
  cancel-in-progress: false
jobs:
  train:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Fetch exact public source revision without stored credentials
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: CPU-only dependencies
        run: |
          set -euo pipefail
          python3 -m venv /tmp/fg
          /tmp/fg/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          /tmp/fg/bin/pip install numpy==2.3.5 safetensors==0.7.0 pytest==8.4.2
      - name: Tests then exactly six fixed-budget trainings and checkpoint publication
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          cd repo
          export PYTHONPATH="$PWD/runs/g4s_prefix/src"
          /tmp/fg/bin/python -m pytest -q runs/g4s_prefix/tests
          /tmp/fg/bin/python -u runs/g4s_prefix/src/ci_complete.py
