name: FlyGraph G3 finite thinking baseline
on:
  push:
    branches: ['flygraph/g3-thinking-20260926']
    paths: ['runs/g3_architecture/bench/RUN_ONCE.json']
permissions:
  contents: read
jobs:
  thinking:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Fetch exact public source without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Finite Qwen thinking evaluation
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python runs/g3_architecture/bench/qwen_thinking.py --prompts runs/g3_architecture/bench/prompts.jsonl --output runs/g3_architecture/bench/thinking_result.json
      - name: Preserve raw completed or explicitly incomplete results on this branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd repo
          python - <<'PY'
          import os,json,base64,urllib.request,hashlib
          from pathlib import Path
          root=Path('runs/g3_architecture/bench');p=root/'thinking_result.json'
          if not p.exists():
              p=root/'thinking_result.partial.json'
              if not p.exists():
                  print('No prediction file: no result published');raise SystemExit(0)
              obj=json.loads(p.read_text());obj['status']='incomplete_not_a_benchmark_result';raw=json.dumps(obj,ensure_ascii=False,indent=2).encode()
          else:
              raw=p.read_bytes();obj=json.loads(raw)
              assert obj['status']=='completed' and len(obj['rows'])==40
          path=f'runs/g3_architecture/bench/results_{os.environ["GITHUB_RUN_ID"]}.json'
          body={'message':'FlyGraph G3: preserve actual thinking outputs with censoring metadata','content':base64.b64encode(raw).decode(),'branch':os.environ['GITHUB_REF_NAME']}
          url=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/contents/{path}'
          req=urllib.request.Request(url,data=json.dumps(body).encode(),method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:receipt=json.load(r)
          print('FG_PUBLICATION',json.dumps({'path':path,'status':obj['status'],'sha256':hashlib.sha256(raw).hexdigest(),'commit':receipt['commit']['sha']}))
          PY
